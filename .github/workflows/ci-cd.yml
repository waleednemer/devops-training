
name: DevOps Training CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================
  # CI: Build and Push
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate Python Code
        run: |
          python -m compileall -q app.py

      - name: Build Docker Image
        run: |
          docker build -t devops-training:test .

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-training:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-training:${{ github.sha }}

  # =========================
  # CD: Deploy to Ubuntu
  # =========================
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # =========================
      # SSH Configuration
      # =========================
      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/github_deploy

          chmod 600 ~/.ssh/github_deploy

          ssh-keygen -y -f ~/.ssh/github_deploy > /dev/null

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "SSH key configured successfully."

      # =========================
      # Deploy Application
      # =========================
      - name: Deploy Application to Ubuntu
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e

          ssh -i ~/.ssh/github_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" << 'EOF'

          set -e

          echo "Pulling latest Docker image..."

          docker pull waleednemer/devops-training:latest

          echo "Stopping old container..."

          docker rm -f devops-training || true

          echo "Starting new container..."

          docker run -d \
            --name devops-training \
            --restart unless-stopped \
            -p 5008:5006 \
            waleednemer/devops-training:latest

          echo "Deployment completed!"

          docker ps

          EOF

      # =========================
      # Deployment Summary
      # =========================
      - name: Deployment Summary
        if: success()
        run: |
          echo "Application deployed successfully to Ubuntu."
